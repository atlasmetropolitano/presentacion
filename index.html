<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presentación - Visor de Analisis Ambiental</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* Pantalla inicial / final */
    #pantalla-inicio {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('img/logo.jpg') center/cover no-repeat;
      color: white;
      text-align: center;
      transition: opacity 1s ease;
      opacity: 1;
    }

    #pantalla-inicio img {
      max-width: 200px;
      margin-bottom: 1rem;
    }

    #pantalla-inicio h1 {
      font-size: 3rem;
      text-shadow: 2px 2px 4px black;
      margin: 0;
      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #pantalla-inicio p {
      font-size: 1.2rem;
      text-shadow: 1px 1px 2px black;
      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #pantalla-inicio button {
      margin-top: 1rem;
      padding: 14px 32px;
      font-size: 1.2rem;
      background-color: rgba(255, 255, 255, 0.9);
      color: #003366;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: background-color 0.3s ease;
    }

    #pantalla-inicio button:hover {
      background-color: #e6e6e6;
    }

    /* Cortinas (telones) */
    .cortina {
      position: fixed;
      top: 0;
      width: 50%;
      height: 100%;
      background-color: #003366;
      z-index: 9;
      transition: all 1s ease-in-out;
    }

    #cortina-izquierda { left: 0; }
    #cortina-derecha { right: 0; }

    .cortina.ocultar-izquierda { transform: translateX(-100%); }
    .cortina.ocultar-derecha { transform: translateX(100%); }

    .cortina.cerrar-izquierda { transform: translateX(0); }
    .cortina.cerrar-derecha { transform: translateX(0); }

    iframe#visor {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 1;
      position: relative;
    }

    #btn-volver {
      display: none;
      position: fixed;
      top: 5px;
      right: 20px;
      z-index: 15;
      background-color: #ffffffcc;
      color: #003366;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
    }

    #btn-volver:hover {
      background-color: #eeeeee;
    }

    /* Efecto fade-in del mensaje final */
    .fade-in {
      opacity: 0;
      animation: aparecer 2s forwards;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 🔹 Botón flotante para ir a la página principal */
    #btn-ir-principal {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background-color: #003366;
      color: white;
      border: none;
      padding: 14px 26px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    #btn-ir-principal:hover {
      background-color: #0055aa;
      transform: translateY(30px) scale(1.05);
    }

    /* Estado visible (fade-in flotante) */
    #btn-ir-principal.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- Pantalla de inicio -->
  <div id="pantalla-inicio">
    <img src="img/Logo.png" alt="Logo CIM" id="logo">
    <h1 id="titulo">Presentación - Visor de Analisis Ambiental</h1>
    <p id="subtitulo">Explorá el territorio con una nueva mirada.</p>
    <button id="btn-abrir" onclick="abrirTelon()">Abrir Visor</button>
  </div>

  <!-- Cortinas -->
  <div id="cortina-izquierda" class="cortina"></div>
  <div id="cortina-derecha" class="cortina"></div>

  <!-- Botón para volver -->
  <button id="btn-volver" onclick="volverInicio()">✖ Volver</button>

  <!-- 🔹 Botón flotante a la página principal -->
  <button id="btn-ir-principal" onclick="irAPrincipal()">🏠 Página Principal</button>

  <!-- Visor -->
  <iframe id="visor" src="https://analisisambiental.users.earthengine.app/view/proyecto-ambiental"></iframe>

  <!-- Audio final
  <audio id="audioFinal" src="audio/aplausos.mp3" preload="auto"></audio> -->

  <script>
    let yaEntro = false;

    function abrirTelon() {
      document.getElementById("pantalla-inicio").style.opacity = "0";
      document.getElementById("cortina-izquierda").classList.add("ocultar-izquierda");
      document.getElementById("cortina-derecha").classList.add("ocultar-derecha");

      setTimeout(() => {
        document.getElementById("pantalla-inicio").style.display = "none";
        document.getElementById("visor").style.display = "block";
        document.getElementById("btn-volver").style.display = "block";
        yaEntro = true;
      }, 1000);
    }

    function volverInicio() {
      document.getElementById("cortina-izquierda").classList.remove("ocultar-izquierda");
      document.getElementById("cortina-derecha").classList.remove("ocultar-derecha");
      document.getElementById("cortina-izquierda").classList.add("cerrar-izquierda");
      document.getElementById("cortina-derecha").classList.add("cerrar-derecha");

      document.getElementById("visor").style.display = "none";
      document.getElementById("btn-volver").style.display = "none";

      setTimeout(() => {
        const inicio = document.getElementById("pantalla-inicio");
        inicio.style.display = "flex";
        inicio.style.opacity = "1";

        if (yaEntro) {
          const titulo = document.getElementById("titulo");
          const subtitulo = document.getElementById("subtitulo");
          const boton = document.getElementById("btn-abrir");
          const audio = document.getElementById("audioFinal");
          const botonPrincipal = document.getElementById("btn-ir-principal");

          titulo.textContent = "¡Gracias por visitar el Atlas Metropolitano!";
          subtitulo.textContent = "Podés volver a la página principal cuando quieras.";
          boton.style.display = "none";

          titulo.classList.add("fade-in");
          subtitulo.classList.add("fade-in");

          // ✨ Mostrar el botón flotante con retardo
          setTimeout(() => {
            botonPrincipal.classList.add("visible");
          }, 2500);

          // Audio con fade-in
          audio.volume = 0;
          audio.play();
          let vol = 0;
          const fade = setInterval(() => {
            if (vol < 1) {
              vol += 0.05;
              audio.volume = vol;
            } else {
              clearInterval(fade);
            }
          }, 100);
        }

        setTimeout(() => {
          document.getElementById("cortina-izquierda").classList.remove("cerrar-izquierda");
          document.getElementById("cortina-derecha").classList.remove("cerrar-derecha");
        }, 400);
      }, 1000);
    }

    // 🔹 Redirigir a la página principal
    function irAPrincipal() {
      window.location.href = "index.html"; // Cambiá si tu página principal está en otra ruta
    }
  </script>

</body>
</html>
